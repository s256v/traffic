name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux builds run in Oracle Linux 8, which has an old glibc (2.28),
          # so the executables also run on older Linux, like Ubuntu 20.04.
          - os: ubuntu-latest
            name: linux-x64
            container: oraclelinux:8
          - os: ubuntu-24.04-arm
            name: linux-arm64
            container: oraclelinux:8
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    # Empty for macOS and Windows, so they build directly on the runner.
    container: ${{ matrix.container }}
    steps:
      - name: Install the build tools
        if: matrix.container
        # gcc and the libraries that native-image links with, and git for actions/checkout.
        run: dnf install -y gcc glibc-devel zlib-devel git-core
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'gradle'
      - name: Test and build the executable
        shell: bash
        run: |
          # A version tag like v0.2.0 sets the version to 0.2.0. Other builds are "dev".
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            ./gradlew test nativeCompile -PappVersion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew test nativeCompile
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: traffic-${{ matrix.name }}
          path: |
            build/native/nativeCompile/traffic
            build/native/nativeCompile/traffic.exe
          if-no-files-found: error

  # On a version tag like v0.1.0, publishes the executables and the Grafana dashboard
  # as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For grafana/dashboard.json. Checkout comes first, as it cleans the workspace.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: traffic-*
          path: artifacts
      - name: Rename the executables, like traffic-linux-x64
        run: |
          mkdir release
          for dir in artifacts/*; do
            name=$(basename "$dir")
            if [ -f "$dir/traffic.exe" ]; then
              mv "$dir/traffic.exe" "release/$name.exe"
            else
              mv "$dir/traffic" "release/$name"
            fi
          done
      - name: Add the Grafana dashboard
        run: cp grafana/dashboard.json release/grafana-dashboard.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
