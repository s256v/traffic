plugins {
    id 'application'
    id 'org.graalvm.buildtools.native' version '1.1.14'
}

// Set by the release workflow from the git tag, e.g. -PappVersion=0.2.0 for v0.2.0.
version = findProperty('appVersion') ?: 'dev'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation 'info.picocli:picocli:4.7.7'
    // Generates the GraalVM native-image configuration for the command-line options.
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'

    implementation 'io.prometheus:prometheus-metrics-core:1.9.0'
    implementation 'io.prometheus:prometheus-metrics-exporter-httpserver:1.9.0'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava') {
    // Options of picocli-codegen. The app uses no dynamic proxies, so skip that config file.
    options.compilerArgs.addAll(['-Aproject=' + project.name, '-Adisable.proxy.config=true'])
}

// Puts the version into the app as the generated class org.fc0.traffic.Version.
def versionDir = layout.buildDirectory.dir('generated/sources/version')
def versionSource = """package org.fc0.traffic;

/** The app's version, generated by Gradle. */
final class Version {
    static final String VALUE = "$version";

    private Version() {
    }
}
"""
def generateVersion = tasks.register('generateVersion') {
    inputs.property('source', versionSource)
    outputs.dir(versionDir)
    doLast {
        def file = versionDir.get().file('org/fc0/traffic/Version.java').asFile
        file.parentFile.mkdirs()
        file.setText(versionSource, 'UTF-8')
    }
}
sourceSets.main.java.srcDir(generateVersion)

application {
    mainClass = 'org.fc0.traffic.Main'
}

tasks.named('test') {
    useJUnitPlatform()
}

graalvmNative {
    binaries {
        main {
            imageName = 'traffic'
            // Run on any CPU of the target architecture, not only on CPUs like the build machine's.
            buildArgs.add('-march=compatibility')
        }
    }
}
